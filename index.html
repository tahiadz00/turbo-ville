  '<div>Parties jouées : '+stats.games+'</div><div>Temps de jeu : '+Math.round(stats.secs/60)+' min</div>'+

function showPanel(k){ov.style.display='flex';ov.innerHTML=k==='help'?helpHtml():(k==='stats'?statsHtml():homeHtml());}
var CHR={Lola:'#ff7ab8',Max:'#6ee7a8',Roux:'#7aa8ff'};
var M=[
{w:'Lola',pre:'Salut la nouvelle ! Va chercher un colis au point jaune.',mid:'Parfait. Livre-le chez Max, il t’attend.',post:'Nickel, t’es rapide !',t:75,s:0},
{w:'Max',pre:'J’ai un moteur à rendre à Lola avant la fermeture du pont !',mid:'Je compte sur toi. Ne tape personne !',post:'Pile à l’heure. Elle va être contente.',t:70,s:0},
{w:'Roux',pre:'Ici l’inspecteur Roux. Je vous ai à l’œil… vous ne livrerez rien.',mid:'Il s’énerve ! Les voitures de police arrivent, sème-les !',post:'Il t’a perdu de vue. Bien joué.',t:90,s:2},
{w:'Lola',pre:'Dernière livraison, la grosse. Roux est sur tes talons.',mid:'Fonce, tout Turbo Ville te regarde !',post:'Tu es une légende. Saison 1 terminée, on continue !',t:100,s:3}];
var state='menu',mi=0,ms=0,TG={x:0,z:0},timer=0,money=0,stars=0,calm=0,bump=0,bust=0,nitro=1,shake=0,tm=0,msgT=0,failWhy='';
var inp={s:0,gas:false,brk:false,nit:false,keys:{}},AC=null,eo=null,eg=null,so=null,sg=null,last=performance.now();
function snd(f,d,t,v,f2){try{if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);}catch(e){}}
function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  if(!eo){eo=AC.createOscillator();eg=AC.createGain();eo.type='sawtooth';eg.gain.value=0;eo.connect(eg);eg.connect(AC.destination);eo.start();
    so=AC.createOscillator();sg=AC.createGain();so.type='square';sg.gain.value=0;so.connect(sg);sg.connect(AC.destination);so.start();ko=AC.createOscillator();kg=AC.createGain();ko.type='sawtooth';ko.frequency.value=950;kg.gain.value=0;ko.connect(kg);kg.connect(AC.destination);ko.start();}}catch(e){}}
function say(w,txt){bub.innerHTML='<span style="color:'+CHR[w]+'">'+w+'</span> : '+txt;bub.style.opacity=1;msgT=5.5;}
function pickTarget(fx,fz,minD){var x,z,n=0;do{x=rl[1+((R()*(N-1))|0)];z=rl[1+((R()*(N-1))|0)];n++;}while(Math.hypot(x-fx,z-fz)<minD&&n<30);TG.x=x;TG.z=z;beacon.position.x=ring.position.x=x;beacon.position.z=ring.position.z=z;beacon.visible=ring.visible=true;}
function startMission(){var m=M[Math.min(mi,M.length-1)];ms=0;hideBC();pickTarget(me.x,me.z,130);say(m.w,m.pre);mn.textContent='Récupère le colis de code au point jaune';}
function setStars(n){stars=Math.max(0,Math.min(3,n));st.textContent=stars?'★'.repeat(stars)+'☆'.repeat(3-stars):'';}
function resetRun(){raceOn=false;me.x=rl[3];me.z=rl[4];me.a=0;me.v=0;me.vx=me.vz=0;cops.forEach(function(c){scene.remove(c.m)});cops=[];setStars(0);bust=0;nitro=1;startMission();}
function begin(){stats.games++;saveS();track('game');right=0;asked=0;missed=[];ensureAudio();ov.style.display='none';state='play';resetRun();}
function finish(why){if(state!=='play')return;state='over';saveG();saveS();snd(120,.6,'sawtooth',.2,40);shake=1;
  if(money>best){best=money;try{localStorage.setItem('tv-best',String(best))}catch(e){}}
  ov.style.display='flex';ov.innerHTML='<div id="ti" style="font-size:clamp(40px,13vw,80px)">'+(why==='bust'?'Arrêté !':'Trop tard')+'</div><div id="su">'+(why==='bust'?'La police t’a coincé.':'Le client n’a pas attendu.')+'<br>Argent : '+money+' € · Record : '+best+' €</div>'+bilan()+'<div id="bt">Touche pour réessayer</div>';}
function hitB(c,r){var hit=false;for(var i=0;i<B.length;i++){var b=B[i],dx=c.x-b.x;if(dx>20||dx<-20)continue;var dz=c.z-b.z,ox=14.5+r-Math.abs(dx),oz=14.5+r-Math.abs(dz);
  if(ox>0&&oz>0){if(ox<oz)c.x+=(dx<0?-1:1)*ox;else c.z+=(dz<0?-1:1)*oz;hit=true;}}
  var L=HALF+8;if(c.x>L){c.x=L;hit=true}if(c.x<-L){c.x=-L;hit=true}if(c.z>L){c.z=L;hit=true}if(c.z<-L){c.z=-L;hit=true}return hit;}
function spawnCop(){var x,z,n=0;do{x=rl[(R()*(N+1))|0];z=rl[(R()*(N+1))|0];n++;}while(Math.hypot(x-me.x,z-me.z)<80&&n<30);
  cops.push({x:x,z:z,a:0,v:0,m:mkCar(0xf4f4f4,true)});}

function update(dt){
  if(state==='garage')return;tm+=dt;var play=state==='play';if(play){stats.secs+=dt;statT+=dt;if(statT>15){statT=0;saveS();}}sky(dt);stepPool(smoke,dt);stepPool(spark,dt);pedsStep(dt);rainStep(dt);
  npcs.forEach(function(n){n.p+=n.dir*n.sp*dt;if(Math.abs(n.p)>HALF+8)n.p=-Math.sign(n.p)*(HALF+8);
    n.x=n.hor?n.p:n.lane;n.z=n.hor?n.lane:n.p;n.m.position.set(n.x,0,n.z);n.m.rotation.y=n.hor?(n.dir>0?PI/2:-PI/2):(n.dir>0?0:PI);});
  if(play){
    var K=inp.keys,thr=(inp.gas||K.ArrowUp||K.KeyW?1:0)-(inp.brk||K.ArrowDown||K.KeyS?1:0),str=inp.s+((K.ArrowLeft||K.KeyA)?-1:0)+((K.ArrowRight||K.KeyD)?1:0);
    str=Math.max(-1,Math.min(1,str));
    var nit=(inp.nit||K.ShiftLeft)&&nitro>0&&thr>0,mx=(40+4*up.eng)*(nit?1.55:1);
    nitro=Math.max(0,Math.min(1,nitro+(nit?-(.45-.05*up.nit):.12+.02*up.nit)*dt));
    if(thr>0)me.v=Math.min(mx,me.v+(nit?48+3*up.eng:26+3*up.eng)*dt);else if(thr<0)me.v=Math.max(-14,me.v-46*dt);else me.v-=Math.sign(me.v)*Math.min(Math.abs(me.v),9*dt);
    var dr=(inp.drift||K.Space);me.a-=str*(2.4+.25*up.grip)*(dr?1.4:1)*(rainK>.5?.9:1)*dt*Math.max(-1,Math.min(1,me.v/10))*(1-.35*Math.abs(me.v)/62);
    var tvx=Math.sin(me.a)*me.v,tvz=Math.cos(me.a)*me.v,kk=Math.min(1,dt*(dr?1.7:(rainK>.5?5:8)));
    me.vx+=(tvx-me.vx)*kk;me.vz+=(tvz-me.vz)*kk;me.x+=me.vx*dt;me.z+=me.vz*dt;
    var slip=Math.hypot(me.vx-tvx,me.vz-tvz);drifting=slip>3.5&&Math.abs(me.v)>12;
    if(drifting){dpts+=slip*dt*4;dq=0;var ca=Math.cos(me.a),sa2=Math.sin(me.a);[-1,1].forEach(function(sd){emit(smoke,me.x-sa2*1.4+ca*.97*sd,.35,me.z-ca*1.4-sa2*.97*sd,(R()-.5)*2,1.2,(R()-.5)*2,.9);});}
    else{dq+=dt;if(dq>.7){if(dpts>25){var gd=Math.floor(dpts);money+=gd;saveG();say('Max','Drift ! +'+gd+' €');snd(740,.25,'sine',.12,1100);}dpts=0;}}
    if(nit)emit(spark,me.x-Math.sin(me.a)*2.2,.6,me.z-Math.cos(me.a)*2.2,-Math.sin(me.a)*9+(R()-.5)*3,(R()-.5)*2,-Math.cos(me.a)*9+(R()-.5)*3,.35);
    if(hitB(me,1.7)){if(Math.abs(me.v)>8){shake=Math.max(shake,.5);snd(90,.2,'square',.12);for(var sI=0;sI<14;sI++)emit(spark,me.x,.8,me.z,(R()-.5)*14,R()*8,(R()-.5)*14,.5);}me.v*=.4;me.vx*=.4;me.vz*=.4;}
    bump-=dt;
    npcs.forEach(function(n){var dx=me.x-n.x,dz=me.z-n.z,d=Math.hypot(dx,dz);if(d<3.4){var f=(3.4-d)/(d||1);me.x+=dx*f;me.z+=dz*f;
      if(bump<=0&&Math.abs(me.v)>6){shake=.6;snd(110,.25,'square',.14);if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}bump=1.5;if(Math.abs(me.v)>14)setStars(stars+1);me.v*=.5;}}});
    var wantC=stars*2,near=999;
    while(cops.length<wantC)spawnCop();
    cops.forEach(function(c,i){var dx=me.x-c.x,dz=me.z-c.z,d=Math.hypot(dx,dz),da=Math.atan2(dx,dz)-c.a;da=Math.atan2(Math.sin(da),Math.cos(da));
      c.a+=Math.max(-1,Math.min(1,da*2))*2.6*dt;var tv=stars?(34+stars*3):12;c.v+=(tv-c.v)*Math.min(1,dt*1.2);
      c.x+=Math.sin(c.a)*c.v*dt;c.z+=Math.cos(c.a)*c.v*dt;if(hitB(c,1.7))c.v*=.5;
      if(d<3.6){var f=(3.6-d)/(d||1);me.x+=dx*f*.5;me.z+=dz*f*.5;c.x-=dx*f*.5;c.z-=dz*f*.5;me.v*=.97;}
      near=Math.min(near,d);c.m.position.set(c.x,0,c.z);c.m.rotation.y=c.a;
      var fl=((tm*6)|0)%2;c.m.userData.l1.visible=!!fl;c.m.userData.l2.visible=!fl;});
    if(stars&&near<4.2)bust+=dt;else bust=Math.max(0,bust-dt*1.5);
    if(bust>2.4){finish('bust');return;}
    if(stars>0){if(near>70){calm+=dt;if(calm>8){calm=0;if(!(M[Math.min(mi,M.length-1)].s>=stars&&ms===1))setStars(stars-1);}}else calm=0;}
    else{for(var q=cops.length-1;q>=0;q--)if(Math.hypot(cops[q].x-me.x,cops[q].z-me.z)>120){scene.remove(cops[q].m);cops.splice(q,1);}}
    runRace(dt);var m=M[Math.min(mi,M.length-1)];
    if(ms===1){timer-=dt;if(timer<=0){finish('time');return;}}
    var tx=TG.x,tz=TG.z;
    if(ms===1){var bd=1e9;BC.forEach(function(b){if(b.on){var d0=Math.hypot(b.x-me.x,b.z-me.z);if(d0<bd){bd=d0;tx=b.x;tz=b.z;}}});}
    var dx2=tx-me.x,dz2=tz-me.z,dd=Math.hypot(dx2,dz2);
    if(ms===0&&dd<7){ms=1;timer=m.t;if(m.s)setStars(Math.max(stars,m.s));beacon.visible=ring.visible=false;askQ(m);snd(660,.3,'sine',.15,990);}
    else if(ms===1){BC.forEach(function(b){if(b.on&&ms===1&&Math.hypot(b.x-me.x,b.z-me.z)<7)answer(b,m);});}
    if(ms<2||raceOn){var rel=Math.atan2(dx2,dz2)-me.a;ar.style.transform='rotate('+(-rel*57.3)+'deg)';ar.style.opacity=1;ds.textContent=Math.round(dd)+' m'+(ms===1?' · '+Math.ceil(timer)+' s':(raceOn?' · course '+Math.ceil(raceT)+' s':''));}
    else{ar.style.opacity=0;ds.textContent='';}
    mo.textContent=money+' €';spdEl.style.opacity=Math.max(0,Math.min(.9,(Math.abs(me.v)-34)/28));sp.textContent=Math.round(Math.abs(me.v)*3.6)+' km/h'+(nit?' ⚡':'');
    if(kg)kg.gain.value=drifting?.012:0;if(eo){eg.gain.value=.025;eo.frequency.value=55+Math.abs(me.v)*5;sg.gain.value=stars&&near<110?.012:0;so.frequency.value=((tm*3)|0)%2?720:880;}
  }
  me.m.position.set(me.x,0,me.z);me.m.rotation.y=me.a;
  if(state==='menu'){me.a+=dt*.4;me.v=0;}
  var cx=me.x-Math.sin(me.a)*11,cz=me.z-Math.cos(me.a)*11;shake=Math.max(0,shake-dt*2.5);
  cam.position.x+=(cx-cam.position.x)*Math.min(1,dt*7);cam.position.z+=(cz-cam.position.z)*Math.min(1,dt*7);cam.position.y=6.2+(R()-.5)*shake;
  cam.position.x+=(R()-.5)*shake*.6;cam.lookAt(me.x+Math.sin(me.a)*6,1.5,me.z+Math.cos(me.a)*6);
  var tf=62+Math.min(1,Math.abs(me.v)/62)*16;if(Math.abs(cam.fov-tf)>.1){cam.fov+=(tf-cam.fov)*.1;cam.updateProjectionMatrix();}
  if(beacon.visible){bm.opacity=.3+.15*Math.sin(tm*4);ring.scale.setScalar(1+.12*Math.sin(tm*4));}
  if(msgT>0){msgT-=dt;if(msgT<=0)bub.style.opacity=0;}
}
function bindBtn(id,k){var e=$(id);e.addEventListener('pointerdown',function(ev){ev.preventDefault();inp[k]=true;e.classList.add('on');try{e.setPointerCapture(ev.pointerId)}catch(x){}});
  var up=function(){inp[k]=false;e.classList.remove('on');};e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);}
bindBtn('gas','gas');bindBtn('brk','brk');bindBtn('nit','nit');bindBtn('drf','drift');$('gar').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();if(state==='play')openGarage();});
var sx=0,sa=false,steer=$('steer');
steer.addEventListener('pointerdown',function(e){e.preventDefault();sx=e.clientX;sa=true;try{steer.setPointerCapture(e.pointerId)}catch(x){}});

addEventListener('keydown',function(e){inp.keys[e.code]=true;if(e.code==='Space'&&(state==='menu'||state==='over')){e.preventDefault();begin();}});
addEventListener('keyup',function(e){inp.keys[e.code]=false;});
ov.addEventListener('pointerdown',function(e){e.preventDefault();
  if(state==='garage'){var t=e.target.closest?e.target.closest('[data-u],[data-c],[data-r]'):null;if(!t)return;
    if(t.dataset.u)buyUp(t.dataset.u);else if(t.dataset.c)paint(+t.dataset.c);else{ov.style.display='none';ov.innerHTML='';state='play';return;}

try{var sv=JSON.parse(localStorage.getItem('tv-save')||'{}');money=sv.m||0;if(sv.up)up=sv.up;colI=sv.c||0;}catch(e){}
me.m.userData.recolor(CARCOL[colI]);
ov.style.display='flex';ov.innerHTML=homeHtml();
